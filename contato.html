<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contato | Psicopedagogia Infantil</title>
  <meta name="description"
        content="Entre em contato para agendar uma avaliação psicopedagógica infantil.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topo">
  <nav class="menu">
    <a href="index.html">Início</a>
    <a href="sobre.html">Sobre</a>
    <a href="atendimento.html">Atendimento</a>
    <a href="processo.html">Como funciona</a>
    <a href="contato.html" class="primary">Contato</a>
  </nav>
</header>

<section class="contact-section">
  <div class="container contact-grid">

    <!-- FORMULÁRIO -->
    <div class="contact-form" data-animate>
      <h2>Agendar avaliação</h2>

      <form
        action="https://formsubmit.co/rm.psicopedagoga@yahoo.com"
        method="POST"
      >

        <!-- CONFIGURAÇÕES FORMSUBMIT -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_subject" value="Novo contato pelo site">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://gabrielcsshtml.github.io/psicopedagogia/obrigado.html">

        <!-- CAMPOS -->
        <input
          type="text"
          name="Nome"
          placeholder="Nome completo"
          required
        >

        <input
          type="email"
          name="Email"
          placeholder="Email"
          required
        >

        <input
          type="tel"
          name="Telefone"
          placeholder="Telefone"
        >

        <textarea
          name="Mensagem"
          placeholder="Mensagem"
          required
        ></textarea>

        <button type="submit" class="btn primary">
          Enviar mensagem
        </button>

      </form>
    </div>

    <!-- INFORMAÇÕES DE CONTATO -->
    <div class="contact-info" data-animate>
      <h3>Informações de contato</h3>

      <p>
        📞
        <a href="tel:+5516993294933">
          +55 16 99329-4933
        </a>
      </p>

      <p>
        ✉️
        <a href="mailto:rm.psicopedagoga@yahoo.com">
          rm.psicopedagoga@yahoo.com
        </a>
      </p>

      <a
        href="https://wa.me/5516993294933"
        class="btn secondary"
        target="_blank"
      >
        Falar no WhatsApp
      </a>
    </div>

  </div>
</section>

<script src="animations.js"></script>
</body>
</html>
